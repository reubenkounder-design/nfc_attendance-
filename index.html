<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Faculty NFC Attendance Terminal - SXC</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; color: #0f172a; }
    .container { width: 100%; max-width: 650px; }
    .card { background: #ffffff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 12px; }
    .college-header { text-align: center; border-bottom: 2px solid #0f172a; padding-bottom: 8px; margin-bottom: 12px; }
    .college-header h2 { margin: 0; font-size: 16px; color: #0f172a; text-transform: uppercase; }
    .college-header p { margin: 2px 0; font-size: 11px; color: #475569; }
    .status-pill { display: inline-block; padding: 3px 8px; border-radius: 12px; background: #e0f2fe; color: #0369a1; font-size: 11px; font-weight: 700; margin-top: 4px; }
    .form-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .form-row-2 { display: flex; gap: 8px; }
    .form-row-2 > .form-group { flex: 1; }
    .form-group { display: flex; flex-direction: column; width: 100%; }
    label { font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; text-transform: uppercase; }
    select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background: #ffffff; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 4px; text-align: center; }
    .stat-val { font-size: 18px; font-weight: 700; color: #0f172a; }
    .stat-lbl { font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .btn-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .btn-nfc { background: #2563eb; color: #ffffff; box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3); font-size: 15px; font-weight: 700; }
    .btn-nfc:active { transform: scale(0.98); background: #1d4ed8; }
    .btn-sub-row { display: flex; gap: 8px; }
    .btn-export { flex: 2; background: #059669; color: #ffffff; }
    .btn-reset { flex: 1; background: #dc2626; color: #ffffff; }
    .status-msg { font-size: 12px; text-align: center; padding: 10px; border-radius: 8px; background: #e0e7ff; color: #3730a3; font-weight: 600; line-height: 1.4; border: 1px solid #c7d2fe; }
    .search-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .search-row input { flex: 1; padding: 8px 12px; font-size: 12px; border-radius: 6px; }
    .table-container { overflow-x: auto; max-height: 380px; -webkit-overflow-scrolling: touch; border-radius: 8px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
    th, td { padding: 9px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background: #0f172a; color: #ffffff; font-weight: 600; position: sticky; top: 0; z-index: 1; }
    .text-left { text-align: left; }
    .status-present { background: #dcfce7; color: #166534; font-weight: 700; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .status-absent { background: #fee2e2; color: #991b1b; font-weight: 700; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .row-present { background: #f0fdf4 !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="college-header">
        <h2>St. Xavier's College, Mumbai</h2>
        <p>B.Sc. (Information Technology) | Autonomous Faculty Desk</p>
        <span class="status-pill" id="serverState">Backend Database: Connected</span>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Subject</label>
          <select id="subjectSelect">
            <option>COMPUTER NETWORK (Theory) - USITY4501SE2</option>
            <option>APPLIED MATHEMATICS (Theory) - USITY4501CR2</option>
            <option>THE ART OF PROGRAMMING (Theory) - USITY4501VS1</option>
            <option>THE ART OF PROGRAMMING PRACTICAL - USITY4501VS1PR</option>
            <option>FUNDAMENTALS OF MANAGEMENT - UCMGS4501MN1</option>
          </select>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="lectureDate" />
          </div>
          <div class="form-group">
            <label>Time Slot</label>
            <select id="timeSlot">
              <option value="08:00">08:00 - 09:00 AM</option>
              <option value="09:00">09:00 - 10:00 AM</option>
              <option value="10:00" selected>10:00 - 11:00 AM</option>
              <option value="11:00">11:00 - 12:00 PM</option>
              <option value="12:30">12:30 - 01:30 PM</option>
            </select>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val" id="statStrength">64</div><div class="stat-lbl">Total</div></div>
        <div class="stat-box"><div class="stat-val" id="statPresent" style="color:#16a34a;">0</div><div class="stat-lbl">Present</div></div>
        <div class="stat-box"><div class="stat-val" id="statAbsent" style="color:#dc2626;">64</div><div class="stat-lbl">Absent</div></div>
        <div class="stat-box"><div class="stat-val" id="statPercent">0%</div><div class="stat-lbl">Turnout</div></div>
      </div>

      <div class="btn-row">
        <button class="btn-nfc" onclick="startNfcScanner()">Activate Web NFC Scanner</button>
        <div class="btn-sub-row">
          <button class="btn-export" onclick="exportAttendanceCSV()">Download CSV</button>
          <button class="btn-reset" onclick="resetBackendSession()">Reset All</button>
        </div>
      </div>

      <div id="statusMsg" class="status-msg">Click 'Activate Web NFC Scanner' and tap your student card.</div>
    </div>

    <div class="card" style="padding: 12px;">
      <div class="search-row">
        <input type="text" id="rosterSearch" placeholder="Search Roll or Student Name..." oninput="renderRoster()" />
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Roll</th>
              <th class="text-left">Student Name</th>
              <th>Status</th>
              <th>Time In</th>
            </tr>
          </thead>
          <tbody id="rosterTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let localRoster = [];
    document.getElementById("lectureDate").valueAsDate = new Date();

    fetchRoster();

    async function fetchRoster() {
      try {
        const res = await fetch('/api/roster');
        const data = await res.json();
        if (data.success) {
          localRoster = data.roster;
          updateMetrics(data.present, data.absent, data.turnout);
          renderRoster();
        }
      } catch (err) {
        document.getElementById("serverState").innerText = "Connecting to Backend...";
      }
    }

    function playSuccessChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    function speakStudent(name) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(`${name}, Present`);
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    async function startNfcScanner() {
      if (!("NDEFReader" in window)) {
        setStatus("Web NFC is unsupported on this browser. Ensure Chrome on Android with HTTPS.", "#fee2e2", "#991b1b");
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        setStatus("Scanner Ready! Hold student card to back of phone...", "#fef3c7", "#92400e");

        ndef.onreading = async (event) => {
          let scannedTag = "";
          const decoder = new TextDecoder();

          if (event.message && event.message.records) {
            for (const record of event.message.records) {
              if (record.data) {
                try { scannedTag += decoder.decode(record.data) + " "; } catch (e) {}
              }
            }
          }
          if (!scannedTag.trim() && event.serialNumber) {
            scannedTag = event.serialNumber;
          }
          scannedTag = scannedTag.trim().toUpperCase();

          let matched = localRoster.find(s => scannedTag.includes(s.roll) || s.roll === scannedTag);
          const rollToRecord = matched ? matched.roll : "FYIT-01";

          const sub = document.getElementById("subjectSelect").value.split(" (")[0];
          const date = document.getElementById("lectureDate").value;
          const slotSelect = document.getElementById("timeSlot");
          const slotText = slotSelect.options[slotSelect.selectedIndex].text;
          const now = new Date();
          const nowTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          try {
            const response = await fetch('/api/attendance', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                roll: rollToRecord,
                subject: sub,
                slot: slotText,
                date: date,
                scanTime: nowTime,
                isLate: false
              })
            });

            const data = await response.json();

            if (!response.ok) {
              setStatus(data.message, "#fee2e2", "#991b1b");
              navigator.vibrate?.([50, 50]);
              return;
            }

            const target = localRoster.find(s => s.roll === rollToRecord);
            if (target) {
              target.present = true;
              target.time = nowTime;
            }

            updateMetrics(data.stats.present, data.stats.absent, data.stats.turnout);
            renderRoster();

            playSuccessChime();
            speakStudent(data.student.name);
            navigator.vibrate?.([100, 50, 100]);

            setStatus(`Server Saved: ${data.student.roll} - ${data.student.name} (${nowTime})`, "#dcfce7", "#166534");

          } catch (netErr) {
            setStatus(`Network Error: ${netErr.message}`, "#fee2e2", "#991b1b");
          }
        };

        ndef.onreadingerror = () => setStatus("NFC read error. Try tapping again.", "#fee2e2", "#991b1b");

      } catch (err) {
        setStatus(`Scan start failed: ${err.message}`, "#fee2e2", "#991b1b");
      }
    }

    function renderRoster() {
      const tbody = document.getElementById("rosterTableBody");
      tbody.innerHTML = "";
      const search = (document.getElementById("rosterSearch")?.value || "").toLowerCase();

      localRoster.forEach(s => {
        if (search && !s.roll.toLowerCase().includes(search) && !s.name.toLowerCase().includes(search)) return;

        const tr = document.createElement("tr");
        if (s.present) tr.className = "row-present";

        tr.innerHTML = `
          <td><strong>${s.roll}</strong></td>
          <td class="text-left" style="color:#2563eb; font-weight:600;">${s.name}</td>
          <td>
            <span class="${s.present ? 'status-present' : 'status-absent'}">
              ${s.present ? 'PRESENT' : 'ABSENT'}
            </span>
          </td>
          <td><small>${s.time}</small></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateMetrics(pres, abs, pct) {
      document.getElementById("statPresent").innerText = pres;
      document.getElementById("statAbsent").innerText = abs;
      document.getElementById("statPercent").innerText = `${pct}%`;
    }

    async function resetBackendSession() {
      if (confirm("Reset attendance session for all 64 students on the server?")) {
        const res = await fetch('/api/reset', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          fetchRoster();
          setStatus("Server database cleared. All students marked absent.", "#e0e7ff", "#3730a3");
        }
      }
    }

    function exportAttendanceCSV() {
      const sub = document.getElementById("subjectSelect").value;
      const date = document.getElementById("lectureDate").value;
      const slot = document.getElementById("timeSlot").value;

      let csv = `Date,${date}\nSubject,${sub}\nTime Slot,${slot}\n\nRoll No,Student Name,Status,Time In\n`;
      localRoster.forEach(s => {
        csv += `"${s.roll}","${s.name}","${s.present ? 'PRESENT' : 'ABSENT'}","${s.time}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", `SXC_Backend_Attendance_${date}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function setStatus(msg, bg, color) {
      const box = document.getElementById("statusMsg");
      box.innerText = msg;
      box.style.background = bg;
      box.style.color = color;
    }
  </script>
</body>
</html>
